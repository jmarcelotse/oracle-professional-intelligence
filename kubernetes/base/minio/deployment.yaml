# MinIO (imagem oficial). Service oracle-minio (API 9000) + console (9001).
# O bucket oracle-files é criado após o deploy (ver scripts/install-data-stack.sh).
apiVersion: v1
kind: Secret
metadata:
  name: oracle-minio
  namespace: oracle-data
type: Opaque
stringData:
  MINIO_ROOT_USER: oracle
  MINIO_ROOT_PASSWORD: oracle123456
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-minio-data
  namespace: oracle-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-minio
  namespace: oracle-data
  labels:
    app: oracle-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-minio
  template:
    metadata:
      labels:
        app: oracle-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: oracle-minio
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oracle-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-minio
  namespace: oracle-data
spec:
  selector:
    app: oracle-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
