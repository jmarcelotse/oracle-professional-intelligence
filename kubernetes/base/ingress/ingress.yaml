# Ingresses do Oracle (ingress-nginx + metallb já existentes no cluster).
# Mesmo padrão dos outros projetos: hostnames *.oracle.local -> 172.18.255.200.
# Adicione ao /etc/hosts:
#   172.18.255.200 dashboard.oracle.local api.oracle.local chat.oracle.local grafana.oracle.local n8n.oracle.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oracle-dashboard
  namespace: oracle-ai
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.oracle.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oracle-dashboard
                port:
                  number: 8501
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oracle-api
  namespace: oracle-ai
