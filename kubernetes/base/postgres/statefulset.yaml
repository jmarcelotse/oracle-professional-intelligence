# PostgreSQL 16 + pgvector (imagem oficial pgvector/pgvector).
# Manifesto próprio em vez do chart Bitnami: a imagem oficial usa o entrypoint
# padrão do Postgres (POSTGRES_*), PGDATA em subdir e precisa de /var/run/postgresql
# gravável. Service mantém o nome oracle-postgres-postgresql para casar com o .env.
apiVersion: v1
kind: Secret
metadata:
  name: oracle-postgres
  namespace: oracle-data
type: Opaque
stringData:
  POSTGRES_USER: oracle
  POSTGRES_PASSWORD: oracle
  POSTGRES_DB: oracle_professional_intelligence
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-postgres-postgresql
  namespace: oracle-data
  labels:
    app: oracle-postgres
spec:
  selector:
    app: oracle-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle-postgres-postgresql
  namespace: oracle-data
  labels:
    app: oracle-postgres
spec:
  serviceName: oracle-postgres-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: oracle-postgres
  template:
    metadata:
      labels:
        app: oracle-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: oracle-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "oracle", "-d", "oracle_professional_intelligence"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "oracle"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
